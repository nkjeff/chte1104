name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: chte1104-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build upstream Android baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Fetch pinned Telegram Android source and diagnose submodules
        timeout-minutes: 270
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Fetching pinned Telegram Android source..."
          timeout --signal=TERM --kill-after=60s 10m \
            git clone --no-checkout --depth 1 https://github.com/TelegramOrg/Telegram-Android.git telegram-source
          timeout --signal=TERM --kill-after=60s 10m \
            git -C telegram-source fetch --depth 1 origin 3de37c8cfb039452be7398909461da6288babf15
          git -C telegram-source checkout --detach 3de37c8cfb039452be7398909461da6288babf15
          git -C telegram-source submodule sync --recursive

          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          mapfile -t SUBMODULE_PATHS < <(git -C telegram-source config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          echo "Found ${#SUBMODULE_PATHS[@]} top-level submodules."

          for index in "${!SUBMODULE_PATHS[@]}"; do
            path="${SUBMODULE_PATHS[$index]}"
            number=$((index + 1))
            echo "::group::Submodule ${number}/${#SUBMODULE_PATHS[@]}: ${path}"
            echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git -C telegram-source config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk -v p="$path" '$2 == p {print "Configured path: " $2}'
            git -C telegram-source submodule status -- "$path" || true

            if timeout --signal=TERM --kill-after=30s 8m \
              git -C telegram-source -c protocol.version=2 \
              submodule update --init --recursive --depth 1 --jobs 1 -- "$path"; then
              echo "First attempt succeeded: ${path}"
            else
              result=$?
              echo "First attempt failed for ${path}, exit code: ${result}"
              echo "Retrying this exact submodule once..."
              if timeout --signal=TERM --kill-after=30s 5m \
                git -C telegram-source -c protocol.version=2 \
                submodule update --init --recursive --depth 1 --jobs 1 -- "$path"; then
                echo "Retry succeeded: ${path}"
              else
                retry_result=$?
                echo "::error title=Submodule fetch failed::${path} failed twice (exit codes ${result}, ${retry_result})"
                echo "Submodule status:"
                git -C telegram-source submodule status --recursive || true
                echo "Submodule configuration:"
                git -C telegram-source config -f .gitmodules --get-regexp '^submodule\..*\.(path|url)$' || true
                echo "Git remotes for failed path:"
                git -C "telegram-source/${path}" remote -v 2>/dev/null || true
                echo "Failed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "::endgroup::"
                exit 1
              fi
            fi

            echo "Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git -C telegram-source submodule status -- "$path" || true
            echo "::endgroup::"
          done

          echo "All top-level and recursive submodules fetched successfully."
          git -C telegram-source submodule status --recursive

      - name: Build using upstream Docker environment
        run: |
          docker build --tag chte1104-telegram-build telegram-source
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/telegram-source:/home/source" \
            chte1104-telegram-build

      - name: Show generated APKs
        if: always()
        run: |
          find telegram-source/TMessagesProj/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chte1104-apk
          path: telegram-source/TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
