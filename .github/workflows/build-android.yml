name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: chte1104-android-build-minimal
  cancel-in-progress: true

jobs:
  build:
    name: Build upstream Android baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Fetch pinned Telegram Android source and diagnose submodules
        timeout-minutes: 180
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Fetching pinned Telegram Android source..."
          timeout --signal=TERM --kill-after=60s 10m \
            git clone --no-checkout --depth 1 https://github.com/TelegramOrg/Telegram-Android.git telegram-source
          timeout --signal=TERM --kill-after=60s 10m \
            git -C telegram-source fetch --depth 1 origin 3de37c8cfb039452be7398909461da6288babf15
          git -C telegram-source checkout --detach 3de37c8cfb039452be7398909461da6288babf15
          git -C telegram-source submodule sync --recursive

          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          fetch_submodules() {
            local repo_dir="$1"
            local prefix="$2"
            local -a paths=()

            if [[ ! -f "$repo_dir/.gitmodules" ]]; then
              return 0
            fi

            mapfile -t paths < <(git -C "$repo_dir" config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
            echo "Repository $repo_dir contains ${#paths[@]} direct submodules."

            for path in "${paths[@]}"; do
              local label="${prefix}${path}"
              echo "::group::Fetching submodule: ${label}"
              echo "::notice title=Submodule fetch::Starting ${label}"
              echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

              if timeout --signal=TERM --kill-after=20s 3m \
                git -C "$repo_dir" -c protocol.version=2 \
                submodule update --init --depth 1 --jobs 1 -- "$path"; then
                echo "Initial fetch succeeded: ${label}"
              else
                result=$?
                echo "Initial fetch failed for ${label}, exit code: ${result}"
                echo "First attempt ended at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "Retrying only ${label} once (2-minute limit)..."
                if timeout --signal=TERM --kill-after=20s 2m \
                  git -C "$repo_dir" -c protocol.version=2 \
                  submodule update --init --depth 1 --jobs 1 -- "$path"; then
                  echo "Retry succeeded: ${label}"
                else
                  retry_result=$?
                  echo "::error title=Submodule fetch failed::${label} failed twice (exit codes ${result}, ${retry_result})"
                  echo "Parent repository: $repo_dir"
                  echo "Submodule path: $path"
                  echo "Configured URL:"
                  git -C "$repo_dir" config -f .gitmodules --get-regexp '^submodule\..*\.url$' || true
                  echo "Submodule status:"
                  git -C "$repo_dir" submodule status -- "$path" || true
                  echo "Failed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "::endgroup::"
                  return 1
                fi
              fi

              echo "Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git -C "$repo_dir" submodule status -- "$path" || true
              echo "::endgroup::"

              fetch_submodules "$repo_dir/$path" "${label}/"
            done
          }

          fetch_submodules "telegram-source" ""
          echo "All nested submodules fetched successfully."
          git -C telegram-source submodule status --recursive
          if git -C telegram-source submodule status --recursive | grep -E "^[+-U]"; then
            echo "::error::One or more submodules are not initialized at the expected commit."
            exit 1
          fi
          test -f telegram-source/TMessagesProj_Modules/media/core_settings.gradle
          echo "Verified required media Gradle settings file."

      - name: Restrict build to standard standalone ARM64 APK
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("telegram-source/TMessagesProj/build.gradle")
          source = gradle_file.read_text()
          needle = "    defaultConfig {\n        minSdkVersion 23"
          replacement = "    defaultConfig {\n        ndk {\n            abiFilters 'arm64-v8a'\n        }\n        minSdkVersion 23"
          if source.count(needle) != 1:
              raise SystemExit("Could not uniquely locate TMessagesProj defaultConfig.")
          gradle_file.write_text(source.replace(needle, replacement, 1))

          app_gradle = Path("telegram-source/TMessagesProj_AppStandalone/build.gradle")
          app_data = app_gradle.read_text()
          flavor_block = '''        afat {
                      ndk {
                          abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                      }'''
          arm64_block = '''        afat {
                      ndk {
                          abiFilters "arm64-v8a"
                      }'''
          if app_data.count(flavor_block) != 1:
              raise SystemExit("Could not uniquely locate standalone afat ABI flavor block.")
          app_gradle.write_text(app_data.replace(flavor_block, arm64_block, 1))

          dockerfile = Path("telegram-source/Dockerfile")
          source = dockerfile.read_text()
          if source.count("CMD mkdir -p") != 1:
              raise SystemExit("Could not uniquely locate upstream Docker CMD.")
          source = source[:source.index("CMD mkdir -p")] + """CMD mkdir -p /home/source/TMessagesProj/build/outputs/apk && \\
              mkdir -p /home/source/TMessagesProj/build/outputs/mapping/TMessagesProj_AppStandalone && \\
              tar -C /home/source \\
                  --exclude=./.git --exclude=.cxx --exclude=build --exclude=.gradle --exclude=./local.properties \\
                  -cf - . | tar -C /home/gradle -xf - && \\
              cd /home/gradle && \\
              gradle --parallel \\
                  :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace && \\
              cp -R /home/gradle/TMessagesProj_AppStandalone/build/outputs/apk/. /home/source/TMessagesProj/build/outputs/apk && \\
              cp -R /home/gradle/TMessagesProj_AppStandalone/build/outputs/mapping/. /home/source/TMessagesProj/build/outputs/mapping/TMessagesProj_AppStandalone
          """
          dockerfile.write_text(source)
          print("Configured ABI filter: arm64-v8a")
          print("Configured app: standard standalone only (Huawei and other variants excluded)")
          PY
          grep -A4 -B1 "abiFilters 'arm64-v8a'" telegram-source/TMessagesProj/build.gradle
          grep -A4 -B1 'abiFilters "arm64-v8a"' telegram-source/TMessagesProj_AppStandalone/build.gradle
          grep -n "assembleAfatStandalone" telegram-source/Dockerfile

      - name: Apply chte1104 minimal branding and dark theme
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("telegram-source")
          strings = root / "TMessagesProj/src/main/res/values/strings.xml"
          data = strings.read_text()
          for label, old_name in (("AppName", "Telegram"), ("AppNameBeta", "Telegram Beta")):
              old = f'<string name="{label}">{old_name}</string>'
              new = f'<string name="{label}">chte1104</string>'
              if data.count(old) != 1:
                  raise SystemExit(f"Could not uniquely rename {label}")
              data = data.replace(old, new, 1)
          strings.write_text(data)

          theme_java = root / "TMessagesProj/src/main/java/org/telegram/ui/ActionBar/Theme.java"
          data = theme_java.read_text()
          for key in ("theme", "nighttheme"):
              old = f'preferences.getString("{key}", null)'
              new = f'preferences.getString("{key}", "Dark")'
              if data.count(old) != 1:
                  raise SystemExit(f"Could not uniquely set first-run {key} theme")
              data = data.replace(old, new, 1)
          theme_java.write_text(data)

          dialogs = root / "TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java"
          data = dialogs.read_text()
          method = "    public void updateStoriesVisibility(boolean animated) {\n"
          if data.count(method) != 1:
              raise SystemExit("Could not uniquely locate main dialog Stories visibility method")
          hide_stories = """    public void updateStoriesVisibility(boolean animated) {
                  if (dialogStoriesCell != null) {
                      dialogStoriesCell.setVisibility(View.GONE);
                      dialogStoriesCellVisible = false;
                      hasStories = false;
                      hasOnlySlefStories = false;
                      progressToDialogStoriesCell = 0f;
                      progressToShowStories = 0f;
                      if (!dialogStoriesCellVisible) {
                          return;
                      }
                  }
          """
          data = data.replace(method, hide_stories, 1)
          dialogs.write_text(data)

          settings = root / "TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java"
          data = settings.read_text()
          settings_gates = (
              ("if (walletAbove && getMessagesController().config.walletAvailable.get()) {",
               "if (false && walletAbove && getMessagesController().config.walletAvailable.get()) {", 1),
              ("if (!walletAbove && getMessagesController().config.walletAvailable.get()) {",
               "if (false && !walletAbove && getMessagesController().config.walletAvailable.get()) {", 1),
              ("if (!getMessagesController().premiumFeaturesBlocked()) {",
               "if (false && !getMessagesController().premiumFeaturesBlocked()) {", 2),
              ("if (getMessagesController().starsPurchaseAvailable()) {",
               "if (false && getMessagesController().starsPurchaseAvailable()) {", 1),
              ("if (ApplicationLoader.isBetaBuild() || ApplicationLoader.isStandaloneBuild() || ApplicationLoader.isHuaweiStoreBuild() || (StarsController.getInstance(currentAccount, true).balanceAvailable() && (StarsController.getInstance(currentAccount, true).hasTransactions() || StarsController.getInstance(currentAccount, true).getBalance().positive()))) {",
               "if (false && (ApplicationLoader.isBetaBuild() || ApplicationLoader.isStandaloneBuild() || ApplicationLoader.isHuaweiStoreBuild() || (StarsController.getInstance(currentAccount, true).balanceAvailable() && (StarsController.getInstance(currentAccount, true).hasTransactions() || StarsController.getInstance(currentAccount, true).getBalance().positive())))) {", 1),
              ("if (!getMessagesController().premiumPurchaseBlocked()) {",
               "if (false && !getMessagesController().premiumPurchaseBlocked()) {", 1),
          )
          for old, new, expected in settings_gates:
              if data.count(old) != expected:
                  raise SystemExit(f"Settings row gate mismatch: expected {expected}, found {data.count(old)} for {old}")
              data = data.replace(old, new)
          settings.write_text(data)

          recommendations = root / "TMessagesProj/src/main/java/org/telegram/ui/Cells/ChannelRecommendationsCell.java"
          data = recommendations.read_text()
          recommendation_gate = "        loading = chats.isEmpty() || !UserConfig.getInstance(currentAccount).isPremium() && chats.size() == 1;"
          if data.count(recommendation_gate) != 1:
              raise SystemExit("Could not uniquely locate similar-channel recommendation gate")
          data = data.replace(recommendation_gate, "        chats.clear();\n        loading = true;", 1)
          recommendations.write_text(data)

          # Remove the sponsored/proxy promo dialog from the main chat list.
          # Keep official PSA announcements visible.
          dialogs_adapter = root / "TMessagesProj/src/main/java/org/telegram/ui/Adapters/DialogsAdapter.java"
          data = dialogs_adapter.read_text()
          array_anchor = """            if (array == null) {
                          array = new ArrayList<>();
                      }
                  }

                  dialogsCount = array.size();"""
          filtered_array = """            if (array == null) {
                          array = new ArrayList<>();
                      }
                  }

                  if (dialogsType == DialogsActivity.DIALOGS_TYPE_DEFAULT && folderId == 0 && communityId == 0) {
                      ArrayList<TLRPC.Dialog> visibleDialogs = new ArrayList<>(array.size());
                      for (TLRPC.Dialog dialog : array) {
                          if (dialog == null || !messagesController.isPromoDialog(dialog.id, false)
                                  || messagesController.promoDialogType == MessagesController.PROMO_TYPE_PSA) {
                              visibleDialogs.add(dialog);
                          }
                      }
                      array = visibleDialogs;
                  }

                  dialogsCount = array.size();"""
          if data.count(array_anchor) != 1:
              raise SystemExit("Could not uniquely locate main chat-list dialog array in DialogsAdapter")
          data = data.replace(array_anchor, filtered_array, 1)
          dialogs_adapter.write_text(data)

          # Hide Premium upsell banners above the main chat list, without
          # changing Premium account features or in-chat Premium functionality.
          dialogs_activity = root / "TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java"
          data = dialogs_activity.read_text()
          premium_gate = "if (!MessagesController.getInstance(currentAccount).premiumFeaturesBlocked() && folderId == 0 && communityId == 0) {"
          if data.count(premium_gate) != 3:
              raise SystemExit(f"Expected 3 chat-list Premium hint gates, found {data.count(premium_gate)}")
          data = data.replace(premium_gate, "if (false && !MessagesController.getInstance(currentAccount).premiumFeaturesBlocked() && folderId == 0 && communityId == 0) {")
          dialogs_activity.write_text(data)

          palette = root / "TMessagesProj/src/main/assets/darkblue.attheme"
          palette_lines = palette.read_text().splitlines()
          black_keys = (
              "windowBackgroundWhite", "windowBackgroundGray", "actionBarDefault",
              "dialogBackground", "chats_menuBackground", "chat_wallpaper",
              "inappPlayerBackground", "chat_emojiPanelBackground",
              "windowBackgroundWhiteInputField",
          )
          blue_keys = (
              "windowBackgroundWhiteBlueText", "dialogTextBlue",
              "actionBarTabActiveText", "actionBarTabLine", "switchTrackBlueChecked",
          )
          blue = str(-0x864001)
          replacements = {key: "-16777216" for key in black_keys}
          replacements.update({key: blue for key in blue_keys})
          for key, value in replacements.items():
              matches = [i for i, line in enumerate(palette_lines) if line.startswith(key + "=")]
              if len(matches) != 1:
                  raise SystemExit(f"Could not uniquely set theme color: {key} ({len(matches)} matches)")
              palette_lines[matches[0]] = key + "=" + value
          palette.write_text("\n".join(palette_lines) + "\n")

          print("Applied chte1104 app label")
          print("Set first-run day/night theme to Dark")
          print("Set core surfaces to pure black and selection accents to soft blue")
          PY
          grep -nE 'AppName|windowBackgroundWhite=|windowBackgroundGray=|actionBarDefault=|windowBackgroundWhiteBlueText=' telegram-source/TMessagesProj/src/main/res/values/strings.xml telegram-source/TMessagesProj/src/main/assets/darkblue.attheme

      - name: Build Docker image with detailed logs
        timeout-minutes: 240
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Docker build started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout --signal=TERM --kill-after=120s 210m \
            bash -o pipefail -c 'docker build --progress=plain --tag chte1104-telegram-build telegram-source 2>&1 | tee "$GITHUB_WORKSPACE/docker-build.log"'
          echo "Docker build finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Run Android build with detailed logs
        timeout-minutes: 120
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Android build started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout --signal=TERM --kill-after=120s 100m \
            bash -o pipefail -c 'docker run --rm --volume "$GITHUB_WORKSPACE/telegram-source:/home/source" chte1104-telegram-build 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"'
          echo "Android build finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Show generated APKs
        if: always()
        shell: bash
        run: |
          echo "APK scan at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          find telegram-source/TMessagesProj/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chte1104-apk
          path: telegram-source/TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chte1104-build-diagnostics
          path: |
            docker-build.log
            android-build.log
          if-no-files-found: ignore
          retention-days: 14
