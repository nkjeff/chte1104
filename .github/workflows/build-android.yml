name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: chte1104-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build upstream Android baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Fetch pinned Telegram Android source and submodules
        timeout-minutes: 60
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        run: |
          set -Eeuo pipefail

          echo "Fetching pinned Telegram Android source..."
          timeout --signal=TERM --kill-after=60s 10m \
            git clone --no-checkout --depth 1 https://github.com/TelegramOrg/Telegram-Android.git telegram-source
          timeout --signal=TERM --kill-after=60s 10m \
            git -C telegram-source fetch --depth 1 origin 3de37c8cfb039452be7398909461da6288babf15
          git -C telegram-source checkout --detach 3de37c8cfb039452be7398909461da6288babf15
          git -C telegram-source submodule sync --recursive

          # Avoid opening too many simultaneous GitHub connections on hosted runners.
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          for attempt in 1 2 3; do
            echo "::group::Submodule download attempt ${attempt}/3"
            echo "Started at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if timeout --signal=TERM --kill-after=60s 15m \
              git -C telegram-source -c protocol.version=2 -c submodule.fetchJobs=2 \
              submodule update --init --recursive --depth 1 --jobs 2; then
              echo "All submodules fetched successfully."
              git -C telegram-source submodule status --recursive
              echo "::endgroup::"
              exit 0
            else
              result=$?
            fi
            echo "Submodule attempt ${attempt} failed (exit ${result})."
            git -C telegram-source submodule status --recursive || true
            echo "Finished at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "::endgroup::"
            if [ "${attempt}" -lt 3 ]; then
              sleep 15
            fi
          done

          echo "Submodule fetching failed after 3 attempts."
          exit 1

      - name: Build using upstream Docker environment
        run: |
          docker build --tag chte1104-telegram-build telegram-source
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/telegram-source:/home/source" \
            chte1104-telegram-build

      - name: Show generated APKs
        if: always()
        run: |
          find telegram-source/TMessagesProj/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chte1104-apk
          path: telegram-source/TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
